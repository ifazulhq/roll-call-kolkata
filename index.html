<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roll Call — A Kolkata Street-Food Atlas</title>
  <meta name="description" content="Ten legendary Kolkata street-food stops, mapped and photographed: what to order, where to find it, when to go, and where to eat it." />
  <meta name="theme-color" content="#F5EBDD" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23D94B32'/%3E%3Cpath d='M16 5c.9 6.5 4.6 10.2 11 11-6.4.9-10.1 4.6-11 11-.9-6.4-4.6-10.1-11-11 6.4-.8 10.1-4.5 11-11Z' fill='%23F5EBDD'/%3E%3C/svg%3E" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("rollcall-theme");
        var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" id="skipLink" href="#map">Skip to the food map</a>

  <header class="site-head">
    <a class="brand" href="#top" aria-label="Roll Call home">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1.5c.7 5.8 4.7 9.8 10.5 10.5-5.8.7-9.8 4.7-10.5 10.5C11.3 16.7 7.3 12.7 1.5 12 7.3 11.3 11.3 7.3 12 1.5Z" fill="currentColor" />
      </svg>
      <span class="brand-text">
        <span class="brand-name" id="brandName">Roll Call</span>
        <span class="brand-sub" id="brandSub">Kolkata Food Atlas</span>
      </span>
    </a>
    <div class="head-right">
      <nav class="site-nav" id="navLinks" aria-label="Primary"></nav>
      <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false">
        <span class="theme-icon" aria-hidden="true">
          <svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.7 8.7 0 1 0 10.7 10.7Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 1.8v2.6M12 19.6v2.6M1.8 12h2.6M19.6 12h2.6M4.8 4.8l1.8 1.8M17.4 17.4l1.8 1.8M19.2 4.8l-1.8 1.8M6.6 17.4l-1.8 1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="theme-label" id="themeLabel">Night mode</span>
      </button>
      <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="navLinks">
        <span class="nav-toggle-bars" aria-hidden="true"><span></span><span></span></span>
        <span class="visually-hidden" id="navToggleLabel">Menu</span>
      </button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="wrap">
        <div class="hero-topline">
          <p class="eyebrow" id="heroKicker">A hungry person's field guide to Kolkata</p>
          <p class="hero-issue" id="heroIssue"></p>
        </div>

        <h1 class="hero-title">
          <span class="hero-line"><span id="heroLine1"></span></span>
          <span class="hero-line hero-line--indent"><span id="heroLine2"></span></span>
          <span class="hero-line hero-line--accent"><span id="heroLine3"></span></span>
        </h1>

        <div class="hero-grid">
          <div class="hero-copy">
            <p class="hero-intro" id="heroIntro"></p>
            <div class="hero-actions" id="heroActions"></div>
          </div>

          <ul class="hero-stats" id="heroStats"></ul>

          <figure class="hero-figure">
            <div class="hero-frame">
              <img id="heroImage" width="1024" height="1280" alt="" fetchpriority="high" />
              <div class="hero-seal" id="heroBadge" role="img" aria-label="Ten-stop Kolkata food atlas seal">
                <svg viewBox="0 0 120 120" aria-hidden="true">
                  <circle cx="60" cy="60" r="58" class="seal-disc" />
                  <defs>
                    <path id="badgeCircle" d="M 60,60 m -43,0 a 43,43 0 1,1 86,0 a 43,43 0 1,1 -86,0" />
                  </defs>
                  <text class="badge-ring-text">
                    <textPath href="#badgeCircle" id="badgeRing"></textPath>
                  </text>
                  <text x="60" y="70" text-anchor="middle" class="badge-number" id="badgeCenter"></text>
                </svg>
              </div>
            </div>
            <figcaption class="hero-caption">
              <span id="heroPlace"></span>
              <span class="hero-caption-coords" id="heroCoords"></span>
            </figcaption>
          </figure>
        </div>

        <p class="scroll-hint" id="scrollHint"></p>
      </div>
    </section>

    <div class="ticker" aria-hidden="true">
      <div class="ticker-track" id="tickerTrack"></div>
    </div>

    <section class="section map-section" id="map">
      <div class="wrap">
        <div class="section-head reveal">
          <div>
            <p class="eyebrow" id="mapKicker"></p>
            <h2 class="section-title" id="mapTitle"></h2>
          </div>
          <p class="section-lede" id="mapLede"></p>
        </div>

        <div class="map-layout">
          <div class="map-panel reveal">
            <div class="map-topbar">
              <span class="map-hint">
                <span class="live-dot" aria-hidden="true"></span>
                <span id="mapHint"></span>
              </span>
              <span class="map-plate" id="mapPlate"></span>
            </div>

            <div class="map-canvas" id="mapCanvas" role="group" aria-label="Stylised illustrated street map of Kolkata">
              <svg class="map-art" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
                <defs>
                  <pattern id="wavePattern" width="44" height="22" patternUnits="userSpaceOnUse">
                    <path d="M0 11 Q11 4 22 11 T44 11" class="wave-line" fill="none" />
                  </pattern>
                </defs>

                <rect class="art-paper" width="800" height="1000" />

                <g class="art-blocks" aria-hidden="true">

                  <rect x="482" y="276" width="55" height="58" rx="7" />
                  <rect x="552" y="296" width="78" height="80" rx="7" />
                  <rect x="658" y="282" width="102" height="76" rx="7" />
                  <rect x="470" y="466" width="120" height="60" rx="7" />
                  <rect x="650" y="460" width="118" height="95" rx="7" />

                  <rect x="600" y="830" width="80" height="50" rx="7" />

                <g class="art-parks" aria-hidden="true">

                  <ellipse class="pond" cx="460" cy="644" rx="34" ry="17" />

                    <circle cx="400" cy="610" r="10" />
                    <circle cx="448" cy="596" r="8" />

                    <circle cx="470" cy="812" r="9" />

                  </g>
                </g>

                <g class="art-roads" aria-hidden="true">
                  <path class="road-case road-case--major" d="M436 0 C428 150 454 280 446 420 C438 560 462 700 448 1000" />

                  <path class="road-case road-case--major" d="M520 300 C574 344 614 404 644 488 C651 509 656 524 660 540" />

                  <path class="road-case road-case--major" d="M662 540 C700 618 736 700 756 810 C768 870 774 930 776 1000" />

                  <path class="road-case" d="M170 262 C250 270 330 278 420 282" />

                  <path class="road-case" d="M602 748 C570 786 536 820 500 850" />
                  <path class="road" d="M602 748 C570 786 536 820 500 850" />
                </g>

                <path class="river" d="M158 0 C138 120 176 220 132 340 C92 460 146 570 108 690 C76 790 120 900 96 1000 L0 1000 L0 0 Z" />

                <path class="river-bank" d="M158 0 C138 120 176 220 132 340 C92 460 146 570 108 690 C76 790 120 900 96 1000" fill="none" />

                <g class="ghats" aria-hidden="true">
                  <path d="M136 300 h20 M132 308 h24 M128 316 h28" />

                  <path d="M112 870 h18 M108 878 h22 M104 886 h26" />

                <path class="ferry-line" d="M20 470 C70 462 112 476 152 468" />

                  <path class="bridge-rail" d="M20 196 C70 188 128 185 194 197" />
                  <path class="bridge-tower" d="M50 198 L50 174 M160 196 L160 172" />
                </g>

                <g class="boat" transform="translate(92 400) rotate(6)" aria-hidden="true">
                  <path class="boat-hull" d="M-16 0 L16 0 L10 8 L-10 8 Z" />
                  <path class="boat-mast" d="M2 0 L2 -20" />
                  <path class="boat-sail" d="M3 -19 L14 -5 L3 -5 Z" />
                </g>
                <g class="boat" transform="translate(78 820) rotate(-4)" aria-hidden="true">
                  <path class="boat-hull" d="M-16 0 L16 0 L10 8 L-10 8 Z" />
                  <path class="boat-mast" d="M2 0 L2 -20" />
                  <path class="boat-sail" d="M3 -19 L14 -5 L3 -5 Z" />
                </g>

                <g class="victoria" transform="translate(558 654)" aria-hidden="true">
                  <rect class="landmark-fill" x="-30" y="-6" width="60" height="30" rx="3" />
                  <path class="landmark-fill" d="M-20 -6 L-20 -20 Q0 -42 20 -20 L20 -6 Z" />
                  <rect class="landmark-line" x="-32" y="24" width="64" height="4" />
                  <rect class="landmark-line" x="-30" y="-6" width="60" height="30" fill="none" />
                  <path class="landmark-line" d="M0 -34 L0 -44 M-4 -40 L0 -44 L4 -40" fill="none" />
                </g>

                <g class="tram" transform="translate(300 556) rotate(-1)" aria-hidden="true">
                  <rect class="tram-body" x="-22" y="-9" width="44" height="18" rx="5" />
                  <rect class="tram-window" x="-15" y="-5" width="10" height="7" rx="1" />
                  <rect class="tram-window" x="-2" y="-5" width="10" height="7" rx="1" />
                  <rect class="tram-window" x="11" y="-5" width="7" height="7" rx="1" />
                  <circle class="tram-wheel" cx="-12" cy="10" r="3" />
                  <circle class="tram-wheel" cx="12" cy="10" r="3" />
                  <path class="tram-wire" d="M0 -10 L0 -22" />
                </g>

                <g class="taxi" transform="translate(602 322) rotate(-18)" aria-hidden="true">
                  <rect class="taxi-body" x="-12" y="-6" width="24" height="12" rx="4" />
                  <rect class="taxi-window" x="-6" y="-5" width="9" height="6" rx="1" />
                  <circle class="taxi-wheel" cx="-7" cy="7" r="2.5" />
                  <circle class="taxi-wheel" cx="7" cy="7" r="2.5" />
                </g>

                <g id="mapLabels"></g>
              </svg>

              <div class="map-pins" id="pins"></div>

              <div class="map-compass" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M12 2.5c.7 4.6 3.7 7.6 8.3 8.3-4.6.7-7.6 3.7-8.3 8.3-.7-4.6-3.7-7.6-8.3-8.3 4.6-.7 7.6-3.7 8.3-8.3Z" fill="currentColor" />
                </svg>
                <span id="compassN">N</span>
              </div>

              <div class="map-stamp" id="mapStamp"></div>
            </div>

            <div class="map-foot">
              <p class="map-note" id="mapNote"></p>
              <ul class="map-legend" id="mapLegend"></ul>
            </div>
          </div>

          <aside class="spotlight reveal" id="spotlight" aria-live="polite"></aside>
        </div>
      </div>
    </section>

    <section class="section stops-section" id="stops">
      <div class="wrap">
        <div class="section-head reveal">
          <div>
            <p class="eyebrow" id="listKicker"></p>
            <h2 class="section-title" id="listTitle"></h2>
          </div>
          <p class="section-lede" id="listLede"></p>
        </div>

        <div class="stops" id="spotGrid"></div>
        <p class="price-note" id="priceNote"></p>
      </div>
    </section>

    <section class="section guide-section" id="guide">
      <div class="wrap">
        <div class="section-head reveal">
          <div>
            <p class="eyebrow" id="guideKicker"></p>
            <h2 class="section-title" id="guideTitle"></h2>
          </div>
          <p class="section-lede" id="guideLede"></p>
        </div>

        <div class="guide-wrap reveal">
          <table class="guide-table">
            <thead id="guideHead"></thead>
            <tbody id="guideBody"></tbody>
          </table>
          <p class="guide-note" id="guideNote"></p>
        </div>
      </div>
    </section>

    <section class="section about-section" id="about">
      <div class="wrap">
        <div class="about-head reveal">
          <div>
            <p class="eyebrow" id="aboutKicker"></p>
            <h2 class="section-title" id="aboutTitle"></h2>
          </div>
          <ul class="about-facts" id="aboutFacts"></ul>
        </div>

        <figure class="about-figure reveal">
          <img id="aboutImage" width="1400" height="933" alt="" loading="lazy" decoding="async" />
          <figcaption id="aboutImageCaption"></figcaption>
        </figure>

        <div class="about-body-grid">
          <div class="about-body reveal" id="aboutBody"></div>
          <aside class="about-aside reveal">
            <blockquote class="pull-quote" id="aboutQuote">
              <p></p>
              <cite></cite>
            </blockquote>
          </aside>
        </div>
      </div>
    </section>

    <div class="footer-band" aria-hidden="true">
      <div class="footer-band-track" id="footerTrack"></div>
    </div>

    <footer class="site-footer">
      <div class="wrap">
        <div class="footer-top reveal">
          <div class="footer-hero">
            <p class="footer-brand" id="footerBrand"></p>
            <h2 class="footer-title" id="footerBig"></h2>
          </div>
          <nav class="footer-nav" id="footerNav" aria-label="Footer"></nav>
        </div>

        <div class="footer-bottom">
          <p class="footer-blurb" id="footerBlurb"></p>
          <div class="footer-meta">
            <p id="madeWith"></p>
            <p id="smallPrint"></p>
            <p class="footer-coords" id="footerCoords"></p>
            <p id="footerCopy"></p>
          </div>
          <a class="footer-back" id="backToMap" href="#map"></a>
        </div>
      </div>
    </footer>
  </main>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
